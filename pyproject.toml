[project]
name = "genomeops-mcp"
version = "0.1.0"
description = "MCP server that makes it easy to run nf-core / Nextflow pipelines on your data — faithful plumbing, no opinions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "nf-core", "nextflow", "bioinformatics", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastmcp>=2.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "pytest-cov>=5.0",
]

[project.scripts]
genomeops-mcp = "genomeops_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genomeops_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: makes real network calls to nf-core / GitHub APIs (deselect with -m 'not integration')"]

[tool.ruff]
line-length = 100
target-version = "py311"
